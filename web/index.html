<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ฟ้าฝน" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>ฟ้าฝน</title>
</head>
<body>
  <div id="map"></div>
  <canvas id="wind"></canvas>

  <header class="top">
    <button id="place-chip" class="glass chip" aria-label="เลือกสถานที่">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span id="place-name">กำลังหาตำแหน่ง…</span>
    </button>
  </header>

  <button id="rain-alert" class="rain-alert glass" hidden></button>

  <div id="places-menu" class="glass menu" hidden></div>

  <nav id="layers" class="glass layers" aria-label="ชั้นแผนที่"></nav>

  <div id="picker" class="picker" hidden><div class="picker-dot"></div><button class="picker-label glass"></button></div>

  <footer class="bottom">
    <div id="legend" class="legend glass"></div>
    <div id="timeline" class="timeline glass"></div>
    <div class="credit">ECMWF · NASA GIBS · RainViewer · Open-Meteo · © OpenStreetMap</div>
  </footer>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-handle"><span></span></div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <div id="toast" class="toast glass" hidden></div>
  <div id="help" class="help" hidden></div>
  <div id="app-loading">กำลังโหลดพยากรณ์…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
